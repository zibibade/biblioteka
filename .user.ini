; Biblioteka — limity i opcache
; Większe limity wgrywania zdjęć egzemplarzy (import idzie jako treść POST-a,
; stąd podbity post_max_size — plik eksportu może mieć kilka MB).
upload_max_filesize = 12M
post_max_size = 128M
max_file_uploads = 20
max_execution_time = 300
memory_limit = 256M

; Hosting trzymał opcache bez sprawdzania znaczników czasu — przez to wgrany
; poprawiony plik PHP był wciąż wykonywany w starej wersji (HTTP 500 mimo
; identycznej zawartości na serwerze).
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0