<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Biblioteka">
  <!-- Kolor NIE jest już twardo wpisany: litera B i strony książki biorą
       `currentColor`. W nagłówku aplikacji logo jest wstawiane jako inline SVG,
       więc dziedziczy akcent aktywnego motywu. Ten plik służy jako favicon
       (renderuje się poza dokumentem, bez dostępu do tokenów), dlatego niżej
       stoi neutralny kolor zapasowy — jasny szary, bez niebieskiego. -->
  <style>
    svg { color: #cbd5e1; }
  </style>
  <rect width="512" height="512" rx="112" fill="#0E1526"/>
  <!-- litera B (zliczona evenodd — liczniki wycięte) -->
  <path fill="currentColor" fill-rule="evenodd" d="
