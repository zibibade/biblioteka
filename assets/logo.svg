    C302 184 290 194 266 194
    H204 Z
    M204 244 H276
    C302 244 315 255 315 277
    C315 299 302 310 276 310
    H204 Z"/>
  <!-- otwarta książka pod literą -->
  <path fill="currentColor" d="M64 404 C124 380 200 380 248 402 L248 470 C200 448 124 448 64 472 Z"/>
